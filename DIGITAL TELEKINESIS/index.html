<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DIGITAL TELEKINESIS</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@600;800&display=swap');

        :root {
            --bg: #070910;
            --cyan: #6dfbea;
            --purple: #a78bfa;
            --muted: #9299ae;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: #f4f6ff;
            font-family: 'Space Mono', monospace;
            overflow: hidden;
        }

        canvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .topbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            padding: 22px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 2;
            pointer-events: none;
        }

        .logo {
            font: 800 16px Syne, sans-serif;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--cyan);
        }

        .live {
            font-size: 10px;
            color: var(--cyan);
            letter-spacing: 1px;
        }

        .panel {
            position: fixed;
            z-index: 3;
            top: 95px;
            left: 25px;
            width: 235px;
            padding: 18px;
            background: #0b0e18d9;
            border: 1px solid #2c3344;
            border-radius: 13px;
            backdrop-filter: blur(15px);
        }

        .eyebrow {
            color: var(--muted);
            font-size: 9px;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        h1 {
            font: 800 27px Syne, sans-serif;
            letter-spacing: -1px;
            margin: 0 0 8px;
        }

        .sub {
            color: var(--muted);
            font-size: 10px;
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .modes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 7px;
        }

        button {
            font: 10px 'Space Mono', monospace;
            color: #e9ecf7;
            background: #151a27;
            border: 1px solid #333b4e;
            border-radius: 7px;
            padding: 11px 7px;
            cursor: pointer;
            transition: .18s;
        }

        button:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        button.active {
            background: #13312f;
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .setting {
            margin-top: 20px;
        }

        .setting-head {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 10px;
        }

        .setting-head span:last-child {
            color: var(--cyan);
        }

        input[type=range] {
            width: 100%;
            accent-color: var(--cyan);
            cursor: pointer;
        }

        .bottom {
            position: fixed;
            z-index: 2;
            left: 26px;
            right: 26px;
            bottom: 22px;
            display: flex;
            justify-content: space-between;
            align-items: end;
            pointer-events: none;
        }

        .stats {
            display: flex;
            gap: 24px;
        }

        .stat small {
            display: block;
            color: var(--muted);
            font-size: 9px;
            margin-bottom: 5px;
        }

        .stat strong {
            font-size: 15px;
            color: var(--cyan);
        }

        .hint {
            font-size: 10px;
            color: #abb2c6;
            text-align: right;
            line-height: 1.8;
        }

        .actions {
            display: flex;
            gap: 8px;
            pointer-events: auto;
        }

        #flash {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            opacity: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), #ffffff55, transparent 35%);
        }

        @media(max-width:650px) {
            .topbar {
                padding: 16px;
            }

            .logo {
                font-size: 12px;
            }

            .live {
                font-size: 8px;
            }

            .panel {
                top: 65px;
                left: 12px;
                width: 195px;
                padding: 12px;
            }

            h1 {
                font-size: 22px;
            }

            .sub {
                font-size: 9px;
                margin-bottom: 12px;
            }

            .eyebrow {
                margin-bottom: 8px;
            }

            button {
                padding: 9px 5px;
                font-size: 9px;
            }

            .setting {
                margin-top: 12px;
            }

            .bottom {
                left: 12px;
                right: 12px;
                bottom: 12px;
            }

            .stats {
                gap: 12px;
            }

            .stat small {
                font-size: 8px;
            }

            .stat strong {
                font-size: 12px;
            }

            .hint {
                display: none;
            }
        }
    </style>
</head>

<body>
    <canvas id="space"></canvas>
    <div id="flash"></div>

    <header class="topbar">
        <div class="logo">DIGITAL <span>TELEKINESIS</span></div>
        <div class="live">● PHYSICS ENGINE ONLINE</div>
    </header>

    <section class="panel">
        <div class="eyebrow">EXPERIMENT / 002</div>
        <h1 id="modeTitle">ATTRACTION</h1>
        <div class="sub" id="modeDesc">Pull the invisible universe with your cursor.</div>

        <div class="modes">
            <button class="active" data-mode="attract">🧲 ATTRACT</button>
            <button data-mode="repel">↗ REPEL</button>
            <button data-mode="gravity">↓ GRAVITY</button>
            <button data-mode="orbit">🌀 ORBIT</button>
            <button data-mode="blackhole">◉ BLACK HOLE</button>
            <button data-mode="freeze">❄ FREEZE</button>
        </div>

        <div class="setting">
            <div class="setting-head">
                <span>FORCE POWER</span><span id="powerVal">65%</span>
            </div>
            <input id="power" type="range" min="10" max="100" value="65">
        </div>

        <div class="setting">
            <div class="setting-head">
                <span>PARTICLE COUNT</span><span id="countVal">650</span>
            </div>
            <input id="count" type="range" min="100" max="1400" step="50" value="650">
        </div>
    </section>

    <footer class="bottom">
        <div class="stats">
            <div class="stat"><small>PARTICLES</small><strong id="particleStat">650</strong></div>
            <div class="stat"><small>FORCE EVENTS</small><strong id="eventStat">0</strong></div>
            <div class="stat"><small>MODE</small><strong id="modeStat">PULL</strong></div>
        </div>
        <div class="hint">MOVE TO CONTROL<br>CLICK TO RELEASE ENERGY</div>
        <div class="actions">
            <button id="burst">✦ SHOCKWAVE</button>
            <button id="reset">↻ RESET</button>
        </div>
    </footer>

    <script>
        const canvas = document.getElementById("space");
        const ctx = canvas.getContext("2d");
        const flash = document.getElementById("flash");

        let W, H, dpr;
        let particles = [];
        let shocks = [];
        let mode = "attract";
        let power = 0.65;
        let count = 650;
        let events = 0;
        let frame = 0;
        let lastTime = 0;
        let paused = false;

        const pointer = {
            x: innerWidth / 2,
            y: innerHeight / 2,
            active: false,
            lastX: innerWidth / 2,
            lastY: innerHeight / 2
        };

        const descriptions = {
            attract: ["ATTRACTION", "Pull the invisible universe with your cursor.", "PULL"],
            repel: ["REPULSION", "Your cursor is an invisible force field.", "PUSH"],
            gravity: ["GRAVITY FIELD", "Particles fall as if your cursor controls gravity.", "GRAVITY"],
            orbit: ["ORBITAL FORCE", "Make the particles orbit an invisible center.", "ORBIT"],
            blackhole: ["BLACK HOLE", "A rotating singularity pulls nearby matter inward.", "SINGULARITY"],
            freeze: ["TIME LOCK", "Freeze particle movement. Switch modes to resume.", "FROZEN"]
        };

        function resize() {
            dpr = Math.min(devicePixelRatio || 1, 2);
            W = innerWidth;
            H = innerHeight;
            canvas.width = W * dpr;
            canvas.height = H * dpr;
            canvas.style.width = W + "px";
            canvas.style.height = H + "px";
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        addEventListener("resize", resize);
        resize();

        function makeParticle(randomY = true) {
            return {
                x: Math.random() * W,
                y: randomY ? Math.random() * H : H + Math.random() * 50,
                vx: (Math.random() - .5) * 1.1,
                vy: (Math.random() - .5) * 1.1,
                size: Math.random() * 1.8 + .5,
                hue: Math.random() > .5 ? 174 : 255,
                alpha: Math.random() * .55 + .3,
                phase: Math.random() * Math.PI * 2
            };
        }

        function resetParticles() {
            particles = Array.from({ length: count }, () => makeParticle());
            shocks = [];
        }
        resetParticles();

        function setMode(newMode) {
            mode = newMode;
            paused = false;
            document.querySelectorAll("[data-mode]").forEach(btn => {
                btn.classList.toggle("active", btn.dataset.mode === mode);
            });
            const d = descriptions[mode];
            document.getElementById("modeTitle").textContent = d[0];
            document.getElementById("modeDesc").textContent = d[1];
            document.getElementById("modeStat").textContent = d[2];
        }

        document.querySelectorAll("[data-mode]").forEach(btn => {
            btn.addEventListener("click", () => setMode(btn.dataset.mode));
        });

        document.getElementById("power").addEventListener("input", e => {
            power = Number(e.target.value) / 100;
            document.getElementById("powerVal").textContent = e.target.value + "%";
        });

        document.getElementById("count").addEventListener("input", e => {
            count = Number(e.target.value);
            document.getElementById("countVal").textContent = count;
            document.getElementById("particleStat").textContent = count;

            if (particles.length < count) {
                while (particles.length < count) particles.push(makeParticle());
            } else {
                particles.length = count;
            }
        });

        function setPointer(e) {
            const rect = canvas.getBoundingClientRect();
            pointer.lastX = pointer.x;
            pointer.lastY = pointer.y;
            pointer.x = e.clientX - rect.left;
            pointer.y = e.clientY - rect.top;
            pointer.active = true;
        }
        canvas.addEventListener("pointermove", setPointer);
        canvas.addEventListener("pointerdown", e => {
            setPointer(e);
            shockwave(pointer.x, pointer.y);
        });
        canvas.addEventListener("pointerleave", () => pointer.active = false);

        function shockwave(x = W / 2, y = H / 2) {
            shocks.push({ x, y, radius: 4, alpha: 1, strength: 12 + power * 25 });
            events++;
            document.getElementById("eventStat").textContent = events;
            flash.style.setProperty("--x", x + "px");
            flash.style.setProperty("--y", y + "px");
            flash.style.opacity = ".6";
            setTimeout(() => flash.style.opacity = "0", 80);
        }

        document.getElementById("burst").addEventListener("click", () => {
            shockwave(pointer.active ? pointer.x : W / 2, pointer.active ? pointer.y : H / 2);
        });

        document.getElementById("reset").addEventListener("click", () => {
            events = 0;
            document.getElementById("eventStat").textContent = "0";
            resetParticles();
            setMode("attract");
        });

        function drawBackground() {
            ctx.fillStyle = "rgba(7,9,16,.28)";
            ctx.fillRect(0, 0, W, H);

            // Subtle technical grid
            ctx.save();
            ctx.strokeStyle = "#20283a";
            ctx.globalAlpha = .3;
            ctx.lineWidth = .6;
            const spacing = 50;
            for (let x = 0; x < W; x += spacing) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
            }
            for (let y = 0; y < H; y += spacing) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
            }
            ctx.restore();
        }

        function applyPhysics(p, dt) {
            if (mode === "freeze") return;

            const dx = pointer.x - p.x;
            const dy = pointer.y - p.y;
            const distSq = dx * dx + dy * dy;
            const dist = Math.sqrt(distSq) || 1;
            const radius = mode === "blackhole" ? 500 : 260;

            if (pointer.active && dist < radius) {
                const influence = Math.pow(1 - dist / radius, 1.4);
                const force = power * influence * .5;

                if (mode === "attract") {
                    p.vx += dx / dist * force * dt;
                    p.vy += dy / dist * force * dt;
                }
                if (mode === "repel") {
                    p.vx -= dx / dist * force * dt;
                    p.vy -= dy / dist * force * dt;
                }
                if (mode === "gravity") {
                    p.vx += dx / dist * force * .5 * dt;
                    p.vy += Math.max(.2, dy / dist) * force * 1.8 * dt;
                }
                if (mode === "orbit") {
                    p.vx += (-dy / dist) * force * 1.7 * dt;
                    p.vy += (dx / dist) * force * 1.7 * dt;
                    p.vx += dx / dist * force * .16 * dt;
                    p.vy += dy / dist * force * .16 * dt;
                }
                if (mode === "blackhole") {
                    p.vx += (dx / dist * force * 1.5 - dy / dist * force * .65) * dt;
                    p.vy += (dy / dist * force * 1.5 + dx / dist * force * .65) * dt;
                    if (dist < 12) {
                        p.x = Math.random() * W;
                        p.y = Math.random() * H;
                        p.vx = 0; p.vy = 0;
                    }
                }
            }

            // Shockwave impulses
            for (const s of shocks) {
                const sx = p.x - s.x;
                const sy = p.y - s.y;
                const sd = Math.sqrt(sx * sx + sy * sy) || 1;
                if (Math.abs(sd - s.radius) < 13) {
                    p.vx += sx / sd * s.strength * .06;
                    p.vy += sy / sd * s.strength * .06;
                }
            }

            // Gentle ambient motion
            p.vx += Math.sin(frame * .008 + p.phase) * .004;
            p.vy += Math.cos(frame * .007 + p.phase) * .004;

            // Damping keeps simulation stable
            p.vx *= .992;
            p.vy *= .992;

            const maxSpeed = 8 + power * 9;
            const speed = Math.hypot(p.vx, p.vy);
            if (speed > maxSpeed) {
                p.vx = p.vx / speed * maxSpeed;
                p.vy = p.vy / speed * maxSpeed;
            }

            p.x += p.vx * dt;
            p.y += p.vy * dt;

            if (p.x < -5) p.x = W + 5;
            if (p.x > W + 5) p.x = -5;
            if (p.y < -5) p.y = H + 5;
            if (p.y > H + 5) p.y = -5;
        }

        function drawParticles(dt) {
            for (const p of particles) {
                applyPhysics(p, dt);

                const speed = Math.hypot(p.vx, p.vy);
                const color = p.hue === 174 ? "109,251,234" : "167,139,250";

                // Speed trails
                if (speed > 1.5) {
                    ctx.strokeStyle = `rgba(${color},${Math.min(.4, speed * .025)})`;
                    ctx.lineWidth = p.size * .8;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - p.vx * 2, p.y - p.vy * 2);
                    ctx.stroke();
                }

                ctx.fillStyle = `rgba(${color},${p.alpha})`;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawShocks(dt) {
            for (let i = shocks.length - 1; i >= 0; i--) {
                const s = shocks[i];
                s.radius += (9 + power * 9) * dt;
                s.alpha -= .014 * dt;

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(109,251,234,${Math.max(0, s.alpha)})`;
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(s.x, s.y, s.radius * .7, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(167,139,250,${Math.max(0, s.alpha * .5)})`;
                ctx.lineWidth = 1;
                ctx.stroke();

                if (s.alpha <= 0) shocks.splice(i, 1);
            }
        }

        function drawCursor() {
            if (!pointer.active) return;

            ctx.save();
            ctx.translate(pointer.x, pointer.y);
            const color = mode === "repel" ? "#ff7aa8" :
                mode === "blackhole" ? "#a78bfa" : "#6dfbea";

            ctx.strokeStyle = color;
            ctx.globalAlpha = .75;
            ctx.lineWidth = 1;

            ctx.beginPath();
            ctx.arc(0, 0, 13 + Math.sin(frame * .08) * 3, 0, Math.PI * 2);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(-24, 0); ctx.lineTo(-8, 0);
            ctx.moveTo(24, 0); ctx.lineTo(8, 0);
            ctx.moveTo(0, -24); ctx.lineTo(0, -8);
            ctx.moveTo(0, 24); ctx.lineTo(0, 8);
            ctx.stroke();

            ctx.restore();
        }

        function animate(now) {
            const dt = Math.min((now - lastTime) / 16.67 || 1, 2);
            lastTime = now;
            frame++;

            ctx.clearRect(0, 0, W, H);
            drawBackground();
            drawParticles(dt);
            drawShocks(dt);
            drawCursor();

            requestAnimationFrame(animate);
        }

        ctx.fillStyle = "#070910";
        ctx.fillRect(0, 0, W, H);
        requestAnimationFrame(animate);
    </script>
</body>

</html>
